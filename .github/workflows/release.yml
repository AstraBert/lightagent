name: GitHub Release

on:
  push:
    tags:
      - "v[0-9].[0-9]+.[0-9]+*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        run: bash compile-all.sh
        working-directory: lightagent-local

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "lightagent-local/dist/*"
          generateReleaseNotes: true
